<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>My Video Tool</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #1e3a8a 0%,
          #111827 45%,
          #030712 100%
        );

      color: white;
    }

    .app {
      width: 100%;
      max-width: 520px;

      padding: 30px;

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;

      background: rgba(31,41,55,.95);

      box-shadow:
        0 20px 60px rgba(0,0,0,.45);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 10px 0 25px;

      text-align: center;

      color: #9ca3af;

      line-height: 1.5;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      color: #d1d5db;

      font-weight: bold;
    }

    textarea {
      width: 100%;

      min-height: 130px;

      padding: 16px;

      border: 1px solid #4b5563;
      border-radius: 14px;

      outline: none;

      resize: vertical;

      background: #111827;
      color: white;

      font-size: 16px;
      font-family: Arial, sans-serif;

      line-height: 1.5;
    }

    textarea:focus {
      border-color: #3b82f6;

      box-shadow:
        0 0 0 3px rgba(59,130,246,.15);
    }

    textarea::placeholder {
      color: #6b7280;
    }

    button {
      width: 100%;

      margin-top: 14px;

      padding: 16px;

      border: none;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #result {
      display: none;

      margin-top: 20px;

      padding: 18px;

      border-radius: 14px;

      background: #111827;

      border: 1px solid #374151;

      line-height: 1.6;

      word-break: break-word;
    }

    .platform {
      color: #60a5fa;
      font-weight: bold;
    }

    .success {
      color: #4ade80;
    }

    .warning {
      color: #fbbf24;
    }

    .error {
      color: #f87171;
    }

    .detected-url {
      display: block;

      margin-top: 8px;

      padding: 10px;

      border-radius: 8px;

      background: #1f2937;

      color: #93c5fd;

      font-size: 13px;

      word-break: break-all;
    }

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #6b7280;

      font-size: 12px;
    }
  </style></head><body>  <div class="app"><div class="logo">
  🎬
</div>

<h1>
  My Video Tool
</h1>

<p class="subtitle">
  Dán liên kết video hoặc toàn bộ nội dung chia sẻ
</p>


<label for="videoUrl">
  Liên kết / nội dung chia sẻ
</label>


<textarea
  id="videoUrl"
  placeholder="Dán link YouTube, TikTok, Facebook, Douyin..."
  autocomplete="off"
></textarea>


<button
  id="analyzeButton"
  onclick="analyzeVideo()"
>
  🔍 PHÂN TÍCH VIDEO
</button>


<div id="result"></div>


<div class="footer">
  My Video Tool • Phiên bản thử nghiệm
</div>

  </div>  <script>

    /*
      Địa chỉ backend Render
    */

    const API_URL =
      "https://my-video-tool-api.onrender.com";


    /*
      Tìm URL trong nội dung được sao chép
    */

    function extractUrl(text) {

      const urlMatches =
        text.match(/https?:\/\/[^\s"'<>]+/gi);


      if (urlMatches && urlMatches.length > 0) {

        let url = urlMatches[0];

        url = url.replace(
          /[)\]}>，。！？；：]+$/g,
          ""
        );

        return url;
      }


      /*
        Hỗ trợ link Douyin nếu phần
        https:// bị mất
      */

      const douyinMatch =
        text.match(
          /(?:v\.douyin\.com|douyin\.com|iesdouyin\.com)\/[A-Za-z0-9?=&._~\/-]+/i
        );


      if (douyinMatch) {

        return "https://" + douyinMatch[0];
      }


      return null;
    }


    /*
      Phân tích video bằng Backend
    */

    async function analyzeVideo() {

      const input =
        document.getElementById("videoUrl");

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("analyzeButton");


      const text =
        input.value.trim();


      result.style.display = "block";


      if (!text) {

        result.innerHTML =
          '<span class="warning">' +
          '⚠️ Hãy dán liên kết video trước.' +
          '</span>';

        return;
      }


      /*
        Tìm URL trong toàn bộ nội dung
      */

      const url =
        extractUrl(text);


      if (!url) {

        result.innerHTML =
          '<span class="error">' +
          '❌ Không tìm thấy liên kết video.' +
          '</span>';

        return;
      }


      /*
        Hiển thị trạng thái đang kết nối
      */

      button.disabled = true;

      button.innerText =
        "⏳ ĐANG PHÂN TÍCH...";


      result.innerHTML =
        '<span class="warning">' +
        '⏳ Đang kết nối với máy chủ...' +
        '</span>';


      try {

        /*
          Gửi URL tới backend
        */

        const response =
          await fetch(
            API_URL + "/api/analyze",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                url: url
              })
            }
          );


        const data =
          await response.json();


        /*
          Backend báo lỗi
        */

        if (!response.ok || !data.success) {

          throw new Error(
            data.message ||
            "Backend không xử lý được liên kết."
          );
        }


        /*
          Backend trả kết quả thành công
        */

        result.innerHTML =

          '<span class="success">' +
          '✅ Backend đã nhận liên kết!' +
          '</span>' +

          '<br><br>' +

          'Nền tảng: ' +

          '<span class="platform">' +
          data.platform +
          '</span>' +

          '<br><br>' +

          'Liên kết:' +

          '<div class="detected-url">' +
          data.url +
          '</div>' +

          '<br>' +

          '<span class="warning">' +
          '✅ Kết nối Web → Backend đã hoạt động.' +
          '<br><br>' +
          '⏳ Bước tiếp theo sẽ xây chức năng lấy thông tin video.' +
          '</span>';

      }


      catch (error) {

        console.error(error);


        result.innerHTML =

          '<span class="error">' +
          '❌ Không kết nối được với backend.' +
          '</span>' +

          '<br><br>' +

          'Chi tiết: ' +

          '<span class="warning">' +
          error.message +
          '</span>' +

          '<br><br>' +

          'Hãy thử lại sau vài giây.';

      }


      finally {

        button.disabled = false;

        button.innerText =
          "🔍 PHÂN TÍCH VIDEO";

      }

    }

  </script></body>
</html>
