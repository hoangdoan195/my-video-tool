<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>My Video Tool</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at top, #1e3a8a 0%, #111827 45%, #030712 100%);

      color: white;
    }

    .app {
      width: 100%;
      max-width: 520px;

      padding: 30px;

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;

      background: rgba(31,41,55,.95);

      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 10px 0 25px;
      text-align: center;
      color: #9ca3af;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d1d5db;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 120px;

      padding: 16px;

      border: 1px solid #4b5563;
      border-radius: 14px;

      outline: none;

      resize: vertical;

      background: #111827;
      color: white;

      font-size: 16px;
      font-family: Arial, sans-serif;

      line-height: 1.5;
    }

    textarea:focus {
      border-color: #3b82f6;

      box-shadow:
        0 0 0 3px rgba(59,130,246,.15);
    }

    textarea::placeholder {
      color: #6b7280;
    }

    button {
      width: 100%;

      margin-top: 14px;

      padding: 16px;

      border: none;
      border-radius: 14px;

      background:
        linear-gradient(135deg, #2563eb, #4f46e5);

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(.98);
    }

    #result {
      display: none;

      margin-top: 20px;

      padding: 18px;

      border-radius: 14px;

      background: #111827;

      border: 1px solid #374151;

      line-height: 1.6;

      word-break: break-word;
    }

    .platform {
      color: #60a5fa;
      font-weight: bold;
    }

    .success {
      color: #4ade80;
    }

    .warning {
      color: #fbbf24;
    }

    .error {
      color: #f87171;
    }

    .detected-url {
      display: block;

      margin-top: 8px;

      padding: 10px;

      border-radius: 8px;

      background: #1f2937;

      color: #93c5fd;

      font-size: 13px;

      word-break: break-all;
    }

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #6b7280;

      font-size: 12px;
    }
  </style></head><body>  <div class="app"><div class="logo">🎬</div>

<h1>My Video Tool</h1>

<p class="subtitle">
  Dán liên kết video hoặc toàn bộ nội dung sao chép
</p>

<label for="videoUrl">
  Liên kết / nội dung chia sẻ
</label>

<textarea
  id="videoUrl"
  placeholder="Dán link video vào đây..."
  autocomplete="off"
></textarea>

<button onclick="analyzeVideo()">
  🔍 PHÂN TÍCH VIDEO
</button>

<div id="result"></div>

<div class="footer">
  My Video Tool • Phiên bản thử nghiệm
</div>

  </div>  <script>

    /*
      Tìm URL nằm bên trong toàn bộ đoạn văn bản.

      Ví dụ Douyin:

      0.58 复制打开抖音，看看【...】
      https://v.douyin.com/n9pWduf74gg/
      01/06 :7pm bNw:/ ...

      Web sẽ tự lấy:
      https://v.douyin.com/n9pWduf74gg/
    */

    function extractUrl(text) {

      const urlRegex =
        /https?:\/\/[^\s"'<>]+/gi;

      const matches =
        text.match(urlRegex);

      if (!matches || matches.length === 0) {
        return null;
      }

      let url = matches[0];

      /*
        Xóa các ký tự thừa có thể dính
        ở cuối URL khi sao chép.
      */

      url = url.replace(
        /[)\]}>，。！？；：]+$/g,
        ""
      );

      return url;
    }


    /*
      Nhận diện nền tảng
    */

    function detectPlatform(url) {

      let hostname;

      try {

        hostname =
          new URL(url)
            .hostname
            .toLowerCase()
            .replace(/^www\./, "");

      } catch (error) {

        return {
          platform: null,
          hostname: null
        };

      }


      /* YouTube */

      if (
        hostname === "youtube.com" ||
        hostname.endsWith(".youtube.com") ||
        hostname === "youtu.be"
      ) {

        return {
          platform: "YouTube",
          hostname: hostname
        };

      }


      /* TikTok */

      if (
        hostname === "tiktok.com" ||
        hostname.endsWith(".tiktok.com") ||
        hostname === "vm.tiktok.com" ||
        hostname.endsWith(".tiktok.com")
      ) {

        return {
          platform: "TikTok",
          hostname: hostname
        };

      }


      /* Facebook */

      if (
        hostname === "facebook.com" ||
        hostname.endsWith(".facebook.com") ||
        hostname === "fb.watch"
      ) {

        return {
          platform: "Facebook",
          hostname: hostname
        };

      }


      /* Instagram */

      if (
        hostname === "instagram.com" ||
        hostname.endsWith(".instagram.com")
      ) {

        return {
          platform: "Instagram",
          hostname: hostname
        };

      }


      /* X / Twitter */

      if (
        hostname === "x.com" ||
        hostname.endsWith(".x.com") ||
        hostname === "twitter.com" ||
        hostname.endsWith(".twitter.com")
      ) {

        return {
          platform: "X / Twitter",
          hostname: hostname
        };

      }


      /* Douyin */

      if (
        hostname === "douyin.com" ||
        hostname.endsWith(".douyin.com") ||
        hostname === "v.douyin.com" ||
        hostname.endsWith(".v.douyin.com") ||
        hostname === "iesdouyin.com" ||
        hostname.endsWith(".iesdouyin.com")
      ) {

        return {
          platform: "Douyin",
          hostname: hostname
        };

      }


      return {
        platform: null,
        hostname: hostname
      };
    }


    /*
      Phân tích
    */

    function analyzeVideo() {

      const input =
        document.getElementById("videoUrl");

      const result =
        document.getElementById("result");

      const text =
        input.value.trim();


      result.style.display = "block";


      /* Không có nội dung */

      if (!text) {

        result.innerHTML =
          '<span class="warning">' +
          '⚠️ Hãy dán liên kết video trước.' +
          '</span>';

        return;
      }


      /*
        Tự tìm URL trong toàn bộ
        nội dung được dán.
      */

      const extractedUrl =
        extractUrl(text);


      if (!extractedUrl) {

        result.innerHTML =
          '<span class="error">' +
          '❌ Không tìm thấy liên kết trong nội dung bạn dán.' +
          '</span>';

        return;
      }


      /*
        Nhận diện nền tảng
      */

      const detected =
        detectPlatform(extractedUrl);


      if (!detected.platform) {

        result.innerHTML =

          '<span class="warning">' +
          '⚠️ Chưa nhận diện được nền tảng.' +
          '</span>' +

          '<br><br>' +

          'Tên miền nhận được: ' +

          '<span class="platform">' +
          detected.hostname +
          '</span>' +

          '<br><br>' +

          'Liên kết đã tìm thấy:' +

          '<span class="detected-url">' +
          extractedUrl +
          '</span>';

        return;
      }


      /*
        Hiển thị thành công
      */

      result.innerHTML =

        '<span class="success">' +
        '✅ Đã nhận liên kết' +
        '</span>' +

        '<br><br>' +

        'Nền tảng: ' +

        '<span class="platform">' +
        detected.platform +
        '</span>' +

        '<br><br>' +

        'Liên kết đã tìm thấy:' +

        '<span class="detected-url">' +
        extractedUrl +
        '</span>' +

        '<br><br>' +

        '<span class="warning">' +
        '⏳ Chức năng lấy thông tin và tải video ' +
        'sẽ được kết nối ở bước tiếp theo.' +
        '</span>';

    }

  </script></body>
</html>
