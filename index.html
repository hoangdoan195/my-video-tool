  </style></head><body>  <div class="app"><div class="logo">
  🎬
</div>


<h1>
  My Video Tool
</h1>


<p class="subtitle">
  Dán liên kết video hoặc nội dung chia sẻ
</p>


<label for="videoUrl">
  Liên kết video
</label>


<textarea
  id="videoUrl"
  placeholder="Dán link YouTube, TikTok, Facebook, Douyin..."
></textarea>


<button
  id="analyzeButton"
  onclick="analyzeVideo()"
>
  🔍 PHÂN TÍCH VIDEO
</button>


<div id="result"></div>


<div class="footer">
  My Video Tool
</div>

  </div>  <script>


    const API_URL =
      "https://my-video-tool-api.onrender.com";


    /*
      Tìm URL trong nội dung được sao chép
    */

    function extractUrl(text) {

      const matches =
        text.match(
          /https?:\/\/[^\s"'<>]+/gi
        );


      if (matches && matches.length > 0) {

        return matches[0].replace(
          /[)\]}>，。！？；：]+$/g,
          ""
        );

      }


      /*
        Hỗ trợ link Douyin khi người dùng
        dán cả đoạn chia sẻ
      */

      const douyin =
        text.match(
          /(?:v\.douyin\.com|douyin\.com|iesdouyin\.com)\/[A-Za-z0-9?=&._~\/-]+/i
        );


      if (douyin) {

        return "https://" + douyin[0];

      }


      return null;

    }


    /*
      Định dạng thời lượng ISO 8601
      Ví dụ PT5M32S → 05:32
    */

    function formatDuration(duration) {

      if (!duration) {
        return "Không có thông tin";
      }


      const match =
        duration.match(
          /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/
        );


      if (!match) {
        return duration;
      }


      const hours =
        parseInt(match[1] || 0);


      const minutes =
        parseInt(match[2] || 0);


      const seconds =
        parseInt(match[3] || 0);


      if (hours > 0) {

        return (
          String(hours).padStart(2, "0") +
          ":" +
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0")
        );

      }


      return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
      );

    }


    /*
      Phân tích video
    */

    async function analyzeVideo() {


      const input =
        document.getElementById("videoUrl");


      const result =
        document.getElementById("result");


      const button =
        document.getElementById("analyzeButton");


      const text =
        input.value.trim();


      result.style.display = "block";


      if (!text) {

        result.innerHTML =
          '<span class="warning">' +
          '⚠️ Hãy dán liên kết video trước.' +
          '</span>';

        return;

      }


      const url =
        extractUrl(text);


      if (!url) {

        result.innerHTML =
          '<span class="error">' +
          '❌ Không tìm thấy liên kết video.' +
          '</span>';

        return;

      }


      button.disabled = true;

      button.innerText =
        "⏳ ĐANG PHÂN TÍCH...";


      result.innerHTML =
        '<span class="warning">' +
        '⏳ Đang lấy thông tin video...' +
        '</span>';


      try {


        const response =
          await fetch(
            API_URL + "/api/analyze",
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                url: url
              })

            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.message ||
            "Không lấy được thông tin video."
          );

        }


        /*
          Nếu backend trả video
        */

        if (data.video) {


          const video =
            data.video;


          const thumbnail =
            video.thumbnail
              ? `
                <img
                  class="thumbnail"
                  src="${video.thumbnail}"
                  alt="Thumbnail video"
                >
              `
              : "";


          result.innerHTML = `

            <div class="success">
              ✅ Phân tích thành công!
            </div>


            <div class="video-card">

              ${thumbnail}


              <div class="video-title">
                ${escapeHtml(
                  video.title ||
                  "Không có tiêu đề"
                )}
              </div>


              <div class="video-info">

                📺 Nền tảng:
                <span class="platform">
                  ${escapeHtml(
                    data.platform || "YouTube"
                  )}
                </span>

                <br>

                👤 Kênh:
                ${escapeHtml(
                  video.channel ||
                  "Không có thông tin"
                )}

                <br>

                ⏱️ Thời lượng:
                ${formatDuration(
                  video.duration
                )}

              </div>


              <div class="video-url">
                ${escapeHtml(
                  data.url || url
                )}
              </div>

            </div>

          `;


        } else {


          result.innerHTML =

            '<span class="success">' +
            '✅ Backend đã nhận liên kết!' +
            '</span>' +

            '<br><br>' +

            'Nền tảng: ' +

            '<span class="platform">' +
            escapeHtml(
              data.platform || "Không xác định"
            ) +
            '</span>';

        }


      }


      catch (error) {


        console.error(error);


        result.innerHTML =

          '<span class="error">' +
          '❌ Không lấy được thông tin video.' +
          '</span>' +

          '<br><br>' +

          '<span class="warning">' +
          escapeHtml(
            error.message
          ) +
          '</span>';

      }


      finally {

        button.disabled = false;

        button.innerText =
          "🔍 PHÂN TÍCH VIDEO";

      }

    }


    /*
      Tránh chèn HTML không an toàn
    */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


  </script></body></html>
