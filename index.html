<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>My Video Tool</title>  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #1e3a8a,
          #111827 50%,
          #030712
        );

      color: white;
    }

    .app {
      width: 100%;
      max-width: 560px;
      padding: 30px;
      border-radius: 24px;

      background: rgba(31, 41, 55, .97);

      border: 1px solid rgba(255, 255, 255, .08);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, .45);
    }

    .logo {
      text-align: center;
      font-size: 46px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      line-height: 1.5;
      margin: 10px 0 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 14px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 16px;

      border: 1px solid #4b5563;
      border-radius: 14px;
      outline: none;
      resize: vertical;

      background: #111827;
      color: white;

      font-size: 16px;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: #3b82f6;

      box-shadow:
        0 0 0 3px rgba(59, 130, 246, .15);
    }

    textarea::placeholder {
      color: #6b7280;
    }

    .analyze-button {
      width: 100%;
      margin-top: 14px;
      padding: 16px;

      border: none;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;

      transition: .2s;
    }

    .analyze-button:hover {
      filter: brightness(1.1);
    }

    .analyze-button:active {
      transform: scale(.98);
    }

    .analyze-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #result {
      display: none;
      margin-top: 22px;
    }

    .status {
      padding: 12px 14px;
      border-radius: 12px;

      font-size: 14px;
      font-weight: bold;
    }

    .success {
      color: #86efac;

      background:
        rgba(34, 197, 94, .10);

      border:
        1px solid rgba(34, 197, 94, .20);
    }

    .error {
      color: #fca5a5;

      background:
        rgba(239, 68, 68, .10);

      border:
        1px solid rgba(239, 68, 68, .20);
    }

    .warning {
      color: #fcd34d;

      background:
        rgba(245, 158, 11, .10);

      border:
        1px solid rgba(245, 158, 11, .20);
    }

    .video-card {
      margin-top: 14px;
      overflow: hidden;

      border-radius: 18px;

      background: #111827;

      border:
        1px solid #374151;
    }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      background: #030712;
    }

    .thumbnail {
      width: 100%;
      display: block;

      aspect-ratio: 16 / 9;

      object-fit: cover;
    }

    .platform-badge {
      position: absolute;

      left: 12px;
      top: 12px;

      padding: 7px 10px;

      border-radius: 8px;

      background:
        rgba(0, 0, 0, .75);

      backdrop-filter: blur(5px);

      font-size: 12px;
      font-weight: bold;
    }

    .video-content {
      padding: 18px;
    }

    .video-title {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .video-info {
      color: #d1d5db;
      font-size: 14px;
      line-height: 2;
    }

    .info-label {
      color: #9ca3af;
    }

    .video-url {
      display: block;

      margin-top: 14px;
      padding: 10px;

      border-radius: 9px;

      background: #1f2937;

      color: #93c5fd;

      font-size: 12px;

      word-break: break-all;
    }

    .next-button {
      width: 100%;

      margin-top: 16px;
      padding: 14px;

      border:
        1px solid #374151;

      border-radius: 12px;

      background: #1f2937;

      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    .next-button:hover {
      background: #374151;
    }

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #6b7280;

      font-size: 12px;
    }

  </style></head><body>  <div class="app"><div class="logo">
  🎬
</div>

<h1>
  My Video Tool
</h1>

<p class="subtitle">
  Dán liên kết video hoặc nội dung chia sẻ
</p>

<label for="videoUrl">
  Liên kết video
</label>

<textarea
  id="videoUrl"
  placeholder="Dán link YouTube, TikTok, Facebook, Douyin..."
></textarea>

<button
  id="analyzeButton"
  class="analyze-button"
  onclick="analyzeVideo()"
>
  🔍 PHÂN TÍCH VIDEO
</button>

<div id="result"></div>

<div class="footer">
  My Video Tool
</div>

  </div>  <script>

    const API_URL =
      "https://my-video-tool-api.onrender.com";


    /*
      Tìm URL trong nội dung được dán
    */

    function extractUrl(text) {

      const matches =
        text.match(
          /https?:\/\/[^\s"'<>]+/gi
        );

      if (matches && matches.length > 0) {

        return matches[0].replace(
          /[)\]}>，。！？；：]+$/g,
          ""
        );

      }

      return null;
    }


    /*
      Định dạng thời lượng
    */

    function formatDuration(duration) {

      if (!duration) {
        return "Không có thông tin";
      }

      const value =
        String(duration);

      const match =
        value.match(
          /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/
        );

      if (!match) {
        return value;
      }

      const hours =
        parseInt(match[1] || 0);

      const minutes =
        parseInt(match[2] || 0);

      const seconds =
        parseInt(match[3] || 0);

      if (hours > 0) {

        return (
          String(hours).padStart(2, "0") +
          ":" +
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0")
        );

      }

      return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
      );

    }


    /*
      Phân tích video
    */

    async function analyzeVideo() {

      const input =
        document.getElementById("videoUrl");

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("analyzeButton");


      const text =
        input.value.trim();


      result.style.display = "block";


      if (!text) {

        result.innerHTML =
          `
          <div class="status warning">
            ⚠️ Hãy dán liên kết video trước.
          </div>
          `;

        return;
      }


      const url =
        extractUrl(text);


      if (!url) {

        result.innerHTML =
          `
          <div class="status error">
            ❌ Không tìm thấy liên kết video.
          </div>
          `;

        return;
      }


      button.disabled = true;

      button.innerText =
        "⏳ ĐANG PHÂN TÍCH...";


      result.innerHTML =
        `
        <div class="status warning">
          ⏳ Đang lấy thông tin video...
        </div>
        `;


      try {

        const response =
          await fetch(
            API_URL + "/api/analyze",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                url: url
              })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Không lấy được thông tin video."
          );

        }


        /*
          Lấy thông tin video.

          Hỗ trợ cả:

          data.video.thumbnail

          và:

          data.thumbnail
        */

        const video =
          data.video || data;


        const thumbnailUrl =
          video.thumbnail ||
          data.thumbnail ||
          null;


        const title =
          video.title ||
          data.title ||
          "Không có tiêu đề";


        const channel =
          video.channel ||
          video.author ||
          data.channel ||
          data.author ||
          "Không có thông tin";


        const duration =
          video.duration ||
          data.duration ||
          null;


        const platform =
          data.platform ||
          video.platform ||
          "Video";


        /*
          Thumbnail
        */

        const thumbnail =
          thumbnailUrl
            ? `

              <div class="thumbnail-wrapper">

                <img
                  class="thumbnail"
                  src="${escapeHtml(thumbnailUrl)}"
                  alt="Thumbnail video"

                  onerror="
                    this.parentElement.style.display='none';
                  "
                >

                <div class="platform-badge">

                  ${getPlatformIcon(platform)}

                  ${escapeHtml(platform)}

                </div>

              </div>

            `
            : "";


        /*
          Kết quả
        */

        result.innerHTML = `

          <div class="status success">

            ✅ Phân tích thành công!

          </div>


          <div class="video-card">

            ${thumbnail}


            <div class="video-content">


              <div class="video-title">

                ${escapeHtml(title)}

              </div>


              <div class="video-info">

                <span class="info-label">
                  👤 Kênh / Tác giả:
                </span>

                ${escapeHtml(channel)}

                <br>


                <span class="info-label">
                  ⏱️ Thời lượng:
                </span>

                ${formatDuration(duration)}

                <br>


                <span class="info-label">
                  🌐 Nền tảng:
                </span>

                ${escapeHtml(platform)}

              </div>


              <div class="video-url">

                ${escapeHtml(
                  data.url || url
                )}

              </div>


              <button
                class="next-button"
                onclick="prepareNextStep()"
              >

                ⬇️ TIẾP TỤC

              </button>


            </div>

          </div>

        `;


      } catch (error) {

        console.error(error);


        result.innerHTML =

          `
          <div class="status error">

            ❌ Không lấy được thông tin video.

            <br><br>

            <span>

              ${escapeHtml(
                error.message
              )}

            </span>

          </div>
          `;

      } finally {

        button.disabled = false;

        button.innerText =
          "🔍 PHÂN TÍCH VIDEO";

      }

    }


    /*
      Biểu tượng nền tảng
    */

    function getPlatformIcon(platform) {

      const name =
        String(platform || "")
          .toLowerCase();


      if (name.includes("youtube")) {
        return "▶️";
      }


      if (name.includes("tiktok")) {
        return "🎵";
      }


      if (name.includes("facebook")) {
        return "📘";
      }


      if (name.includes("douyin")) {
        return "🎵";
      }


      return "🎬";

    }


    /*
      Nút TIẾP TỤC
    */

    function prepareNextStep() {

      alert(
        "Thông tin video đã sẵn sàng. Chức năng tiếp theo sẽ được xây dựng ở bước sau."
      );

    }


    /*
      Bảo vệ nội dung HTML
    */

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script></body>
</html>
