<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>My Video Tool</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #1e3a8a,
          #111827 50%,
          #030712
        );

      color: white;
    }

    .app {
      width: 100%;
      max-width: 600px;

      padding: 30px;

      border-radius: 24px;

      background: rgba(31, 41, 55, .97);

      border:
        1px solid rgba(255, 255, 255, .08);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, .45);
    }

    .logo {
      text-align: center;
      font-size: 46px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;

      text-align: center;

      font-size: 28px;
    }

    .subtitle {
      text-align: center;

      color: #9ca3af;

      line-height: 1.5;

      margin:
        10px 0 25px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #d1d5db;

      font-size: 14px;

      font-weight: bold;
    }

    textarea {
      width: 100%;

      min-height: 130px;

      padding: 16px;

      border:
        1px solid #4b5563;

      border-radius: 14px;

      outline: none;

      resize: vertical;

      background: #111827;

      color: white;

      font-size: 16px;

      font-family: Arial, sans-serif;

      line-height: 1.5;
    }

    textarea:focus {
      border-color: #3b82f6;

      box-shadow:
        0 0 0 3px
        rgba(59, 130, 246, .15);
    }

    textarea::placeholder {
      color: #6b7280;
    }

    .analyze-button {
      width: 100%;

      margin-top: 14px;

      padding: 16px;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    .analyze-button:hover {
      filter: brightness(1.1);
    }

    .analyze-button:active {
      transform: scale(.98);
    }

    .analyze-button:disabled {
      opacity: .6;

      cursor: not-allowed;
    }

    #result {
      display: none;

      margin-top: 22px;
    }

    .status {
      padding: 12px 14px;

      border-radius: 12px;

      font-size: 14px;

      font-weight: bold;
    }

    .success {
      color: #86efac;

      background:
        rgba(34, 197, 94, .10);

      border:
        1px solid
        rgba(34, 197, 94, .20);
    }

    .error {
      color: #fca5a5;

      background:
        rgba(239, 68, 68, .10);

      border:
        1px solid
        rgba(239, 68, 68, .20);
    }

    .warning {
      color: #fcd34d;

      background:
        rgba(245, 158, 11, .10);

      border:
        1px solid
        rgba(245, 158, 11, .20);
    }

    .video-card {
      margin-top: 14px;

      overflow: hidden;

      border-radius: 18px;

      background: #111827;

      border:
        1px solid #374151;
    }

    .thumbnail-wrapper {
      position: relative;

      width: 100%;

      background: #030712;
    }

    .thumbnail {
      width: 100%;

      display: block;

      aspect-ratio: 16 / 9;

      object-fit: cover;
    }

    .platform-badge {
      position: absolute;

      left: 12px;
      top: 12px;

      padding:
        7px 10px;

      border-radius: 8px;

      background:
        rgba(0, 0, 0, .75);

      backdrop-filter: blur(5px);

      font-size: 12px;

      font-weight: bold;
    }

    .video-content {
      padding: 18px;
    }

    .video-title {
      font-size: 20px;

      font-weight: bold;

      line-height: 1.4;

      margin-bottom: 14px;
    }

    .video-info {
      color: #d1d5db;

      font-size: 14px;

      line-height: 2;
    }

    .info-label {
      color: #9ca3af;
    }

    .video-url {
      display: block;

      margin-top: 14px;

      padding: 10px;

      border-radius: 9px;

      background: #1f2937;

      color: #93c5fd;

      font-size: 12px;

      word-break: break-all;
    }

    /*
    ========================================
    DOWNLOAD OPTIONS
    ========================================
    */

    .download-section {
      margin-top: 20px;

      padding-top: 20px;

      border-top:
        1px solid #374151;
    }

    .download-title {
      margin-bottom: 12px;

      font-size: 17px;

      font-weight: bold;
    }

    .format-list {
      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .format-option {
      position: relative;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 14px;

      border:
        1px solid #374151;

      border-radius: 14px;

      background: #1f2937;

      cursor: pointer;

      transition: .2s;
    }

    .format-option:hover {
      border-color: #4b5563;

      background: #273449;
    }

    .format-option.selected {
      border-color: #3b82f6;

      background:
        rgba(37, 99, 235, .12);

      box-shadow:
        0 0 0 1px
        rgba(59, 130, 246, .2);
    }

    .format-radio {
      width: 20px;

      height: 20px;

      margin: 0;

      accent-color: #3b82f6;

      flex-shrink: 0;
    }

    .format-main {
      flex: 1;

      min-width: 0;
    }

    .format-name {
      font-size: 15px;

      font-weight: bold;

      color: white;
    }

    .format-details {
      margin-top: 4px;

      color: #9ca3af;

      font-size: 12px;
    }

    .format-badge {
      padding:
        5px 8px;

      border-radius: 7px;

      background: #374151;

      color: #d1d5db;

      font-size: 11px;

      font-weight: bold;
    }

    .download-button {
      width: 100%;

      margin-top: 14px;

      padding: 15px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #16a34a,
          #059669
        );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    .download-button:hover {
      filter: brightness(1.1);
    }

    .download-button:active {
      transform: scale(.98);
    }

    .download-button:disabled {
      opacity: .5;

      cursor: not-allowed;
    }

    .download-note {
      margin-top: 9px;

      color: #6b7280;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;
    }

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #6b7280;

      font-size: 12px;
    }

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .app {
        padding: 22px 16px;

        border-radius: 20px;
      }

      .logo {
        font-size: 40px;
      }

      h1 {
        font-size: 24px;
      }

      .video-title {
        font-size: 18px;
      }
    }
  </style></head><body>  <div class="app"><div class="logo">
  🎬
</div>

<h1>
  My Video Tool
</h1>

<p class="subtitle">
  Dán liên kết video để phân tích và chọn định dạng tải xuống
</p>

<label for="videoUrl">
  Liên kết video
</label>

<textarea
  id="videoUrl"
  placeholder="Dán link YouTube, TikTok, Facebook, Douyin..."
></textarea>

<button
  id="analyzeButton"
  class="analyze-button"
  onclick="analyzeVideo()"
>
  🔍 PHÂN TÍCH VIDEO
</button>

<div id="result"></div>

<div class="footer">
  My Video Tool
</div>

  </div>  <script>

    const API_URL =
      "https://my-video-tool-api.onrender.com";


    /*
    ========================================
    TÌM URL
    ========================================
    */

    function extractUrl(text) {

      const matches =
        text.match(
          /https?:\/\/[^\s"'<>]+/gi
        );

      if (
        matches &&
        matches.length > 0
      ) {

        return matches[0].replace(
          /[)\]}>，。！？；：]+$/g,
          ""
        );

      }

      return null;
    }


    /*
    ========================================
    FORMAT DURATION
    ========================================
    */

    function formatDuration(duration) {

      if (
        duration === null ||
        duration === undefined ||
        duration === ""
      ) {
        return "Không có thông tin";
      }

      const value =
        String(duration);


      /*
      YouTube ISO 8601
      */

      const match =
        value.match(
          /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/i
        );

      if (match) {

        const hours =
          parseInt(match[1] || 0);

        const minutes =
          parseInt(match[2] || 0);

        const seconds =
          parseInt(match[3] || 0);


        if (hours > 0) {

          return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0")
          );

        }


        return (
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0")
        );
      }


      /*
      TikTok / Douyin số giây
      */

      const numeric =
        Number(value);

      if (
        Number.isFinite(numeric)
      ) {

        const total =
          Math.max(
            0,
            Math.round(numeric)
          );

        const minutes =
          Math.floor(total / 60);

        const seconds =
          total % 60;

        return (
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0")
        );
      }


      return value;
    }


    /*
    ========================================
    PHÂN TÍCH VIDEO
    ========================================
    */

    async function analyzeVideo() {

      const input =
        document.getElementById(
          "videoUrl"
        );

      const result =
        document.getElementById(
          "result"
        );

      const button =
        document.getElementById(
          "analyzeButton"
        );


      const text =
        input.value.trim();


      result.style.display =
        "block";


      if (!text) {

        result.innerHTML = `
          <div class="status warning">
            ⚠️ Hãy dán liên kết video trước.
          </div>
        `;

        return;
      }


      const url =
        extractUrl(text);


      if (!url) {

        result.innerHTML = `
          <div class="status error">
            ❌ Không tìm thấy liên kết video.
          </div>
        `;

        return;
      }


      button.disabled =
        true;

      button.innerText =
        "⏳ ĐANG PHÂN TÍCH...";


      result.innerHTML = `
        <div class="status warning">
          ⏳ Đang lấy thông tin video...
        </div>
      `;


      try {

        const response =
          await fetch(
            API_URL + "/api/analyze",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  url: url
                })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Không lấy được thông tin video."
          );
        }


        const video =
          data.video || data;


        const thumbnailUrl =
          video.thumbnail ||
          data.thumbnail ||
          null;


        const title =
          video.title ||
          data.title ||
          "Không có tiêu đề";


        const channel =
          video.channel ||
          video.author ||
          data.channel ||
          data.author ||
          "Không có thông tin";


        const duration =
          video.duration ||
          data.duration ||
          null;


        const platform =
          data.platform ||
          video.platform ||
          "Video";


        /*
        ====================================
        THUMBNAIL
        ====================================
        */

        const thumbnail =
          thumbnailUrl
            ? `
              <div class="thumbnail-wrapper">

                <img
                  class="thumbnail"
                  src="${escapeHtml(thumbnailUrl)}"
                  alt="Thumbnail video"

                  onerror="
                    this.parentElement.style.display='none';
                  "
                >

                <div class="platform-badge">

                  ${getPlatformIcon(platform)}

                  ${escapeHtml(platform)}

                </div>

              </div>
            `
            : "";


        /*
        ====================================
        DOWNLOAD OPTIONS
        ====================================
        */

        const formats =
          buildDownloadOptions(
            data,
            video,
            url
          );


        result.innerHTML = `

          <div class="status success">
            ✅ Phân tích thành công!
          </div>


          <div class="video-card">

            ${thumbnail}


            <div class="video-content">

              <div class="video-title">
                ${escapeHtml(title)}
              </div>


              <div class="video-info">

                <span class="info-label">
                  👤 Kênh / Tác giả:
                </span>

                ${escapeHtml(channel)}

                <br>


                <span class="info-label">
                  ⏱️ Thời lượng:
                </span>

                ${formatDuration(duration)}

                <br>


                <span class="info-label">
                  🌐 Nền tảng:
                </span>

                ${escapeHtml(platform)}

              </div>


              <div class="video-url">
                ${escapeHtml(
                  data.url || url
                )}
              </div>


              <div class="download-section">

                <div class="download-title">
                  ⬇️ Chọn định dạng tải xuống
                </div>


                <div
                  id="formatList"
                  class="format-list"
                >
                  ${formats}
                </div>


                <button
                  id="downloadButton"
                  class="download-button"
                  onclick="downloadSelectedFormat()"
                >
                  ⬇️ TẢI XUỐNG
                </button>


                <div class="download-note">
                  Tùy chọn tải xuống sẽ phụ thuộc vào dữ liệu mà máy chủ cung cấp.
                </div>

              </div>

            </div>

          </div>

        `;


        setupFormatSelection();


      } catch (error) {

        console.error(error);


        result.innerHTML = `
          <div class="status error">

            ❌ Không lấy được thông tin video.

            <br><br>

            <span>
              ${escapeHtml(
                error.message
              )}
            </span>

          </div>
        `;

      } finally {

        button.disabled =
          false;

        button.innerText =
          "🔍 PHÂN TÍCH VIDEO";
      }

    }


    /*
    ========================================
    TẠO CÁC LỰA CHỌN DOWNLOAD
    ========================================
    */

    function buildDownloadOptions(
      data,
      video,
      originalUrl
    ) {

      /*
      Backend sau này có thể trả:

      data.formats = [...]

      hoặc:

      video.formats = [...]
      */

      const backendFormats =
        data.formats ||
        video.formats ||
        null;


      if (
        Array.isArray(backendFormats) &&
        backendFormats.length > 0
      ) {

        return backendFormats
          .map(
            (format, index) => {

              const formatId =
                format.id ||
                format.itag ||
                index;


              const name =
                format.name ||
                format.quality ||
                format.label ||
                format.ext?.toUpperCase() ||
                "Video";


              const type =
                format.type ||
                format.ext ||
                "MP4";


              const quality =
                format.quality ||
                format.resolution ||
                "";


              const url =
                format.url ||
                format.downloadUrl ||
                format.download_url ||
                "";


              return `
                <label
                  class="format-option ${index === 0 ? "selected" : ""}"
                  data-format-id="${escapeHtml(formatId)}"
                  data-download-url="${escapeHtml(url)}"
                  data-original-url="${escapeHtml(originalUrl)}"
                >

                  <input
                    type="radio"
                    name="videoFormat"
                    class="format-radio"
                    ${index === 0 ? "checked" : ""}
                  >


                  <div class="format-main">

                    <div class="format-name">
                      ${escapeHtml(name)}
                    </div>

                    <div class="format-details">
                      ${escapeHtml(type)}
                      ${quality ? " • " + escapeHtml(quality) : ""}
                    </div>

                  </div>


                  <div class="format-badge">
                    ${escapeHtml(
                      String(type).toUpperCase()
                    )}
                  </div>

                </label>
              `;
            }
          )
          .join("");
      }


      /*
      ====================================
      FALLBACK
      ====================================

      Khi backend chưa trả formats,
      giao diện vẫn hiển thị các lựa chọn
      để chuẩn bị cho bước backend tiếp theo.
      */

      return `

        <label
          class="format-option selected"
          data-format-id="mp4"
          data-download-url=""
          data-original-url="${escapeHtml(originalUrl)}"
        >

          <input
            type="radio"
            name="videoFormat"
            class="format-radio"
            checked
          >

          <div class="format-main">

            <div class="format-name">
              MP4
            </div>

            <div class="format-details">
              Video • Chất lượng tự động
            </div>

          </div>

          <div class="format-badge">
            MP4
          </div>

        </label>


        <label
          class="format-option"
          data-format-id="mp4-hd"
          data-download-url=""
          data-original-url="${escapeHtml(originalUrl)}"
        >

          <input
            type="radio"
            name="videoFormat"
            class="format-radio"
          >

          <div class="format-main">

            <div class="format-name">
              MP4 HD
            </div>

            <div class="format-details">
              Video • HD
            </div>

          </div>

          <div class="format-badge">
            HD
          </div>

        </label>


        <label
          class="format-option"
          data-format-id="mp3"
          data-download-url=""
          data-original-url="${escapeHtml(originalUrl)}"
        >

          <input
            type="radio"
            name="videoFormat"
            class="format-radio"
          >

          <div class="format-main">

            <div class="format-name">
              MP3
            </div>

            <div class="format-details">
              Âm thanh • MP3
            </div>

          </div>

          <div class="format-badge">
            MP3
          </div>

        </label>
      `;
    }


    /*
    ========================================
    CHỌN FORMAT
    ========================================
    */

    function setupFormatSelection() {

      const options =
        document.querySelectorAll(
          ".format-option"
        );


      options.forEach(
        option => {

          option.addEventListener(
            "click",
            () => {

              options.forEach(
                item => {
                  item.classList.remove(
                    "selected"
                  );
                }
              );


              option.classList.add(
                "selected"
              );


              const radio =
                option.querySelector(
                  ".format-radio"
                );


              if (radio) {
                radio.checked =
                  true;
              }

            }
          );

        }
      );

    }


    /*
    ========================================
    TẢI FORMAT ĐÃ CHỌN
    ========================================
    */

    function downloadSelectedFormat() {

      const selected =
        document.querySelector(
          ".format-option.selected"
        );


      if (!selected) {

        alert(
          "Vui lòng chọn định dạng tải xuống."
        );

        return;
      }


      const downloadUrl =
        selected.dataset.downloadUrl;


      /*
      Nếu backend đã cung cấp URL tải
      thì mở URL đó.
      */

      if (downloadUrl) {

        window.location.href =
          downloadUrl;

        return;
      }


      /*
      Hiện tại backend chưa có API
      tạo link download.

      Vì vậy chưa giả vờ tải file.
      */

      alert(
        "Định dạng đã được chọn. Backend tải xuống sẽ được kết nối ở bước tiếp theo."
      );
    }


    /*
    ========================================
    ICON PLATFORM
    ========================================
    */

    function getPlatformIcon(platform) {

      const name =
        String(platform || "")
          .toLowerCase();


      if (
        name.includes("youtube")
      ) {
        return "▶️";
      }


      if (
        name.includes("tiktok")
      ) {
        return "🎵";
      }


      if (
        name.includes("facebook")
      ) {
        return "📘";
      }


      if (
        name.includes("douyin")
      ) {
        return "🎵";
      }


      return "🎬";
    }


    /*
    ========================================
    ESCAPE HTML
    ========================================
    */

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );
    }

  </script></body>
</html>
