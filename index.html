<h1>
  My Video Tool
</h1>

<p class="subtitle">
  Dán liên kết video hoặc nội dung chia sẻ
</p>

<label for="videoUrl">
  Liên kết video
</label>

<textarea
  id="videoUrl"
  placeholder="Dán link YouTube, TikTok, Facebook, Douyin..."
></textarea>

<button
  id="analyzeButton"
  class="analyze-button"
  onclick="analyzeVideo()"
>
  🔍 PHÂN TÍCH VIDEO
</button>

<div id="result"></div>

<div class="footer">
  My Video Tool
</div>

  </div>  <script>

    const API_URL =
      "https://my-video-tool-api.onrender.com";


    /*
      Tìm URL trong nội dung được sao chép
    */

    function extractUrl(text) {

      const matches =
        text.match(
          /https?:\/\/[^\s"'<>]+/gi
        );


      if (matches && matches.length > 0) {

        return matches[0].replace(
          /[)\]}>，。！？；：]+$/g,
          ""
        );

      }


      /*
        Hỗ trợ link Douyin
      */

      const douyin =
        text.match(
          /(?:v\.douyin\.com|douyin\.com|iesdouyin\.com)\/[A-Za-z0-9?=&._~\/-]+/i
        );


      if (douyin) {

        return "https://" + douyin[0];

      }


      return null;

    }


    /*
      Đổi thời lượng ISO 8601
    */

    function formatDuration(duration) {

      if (!duration) {

        return "Không có thông tin";

      }


      const match =
        duration.match(
          /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/
        );


      if (!match) {

        return duration;

      }


      const hours =
        parseInt(match[1] || 0);

      const minutes =
        parseInt(match[2] || 0);

      const seconds =
        parseInt(match[3] || 0);


      if (hours > 0) {

        return (

          String(hours).padStart(2, "0") +
          ":" +
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0")

        );

      }


      return (

        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")

      );

    }


    /*
      Phân tích video
    */

    async function analyzeVideo() {

      const input =
        document.getElementById("videoUrl");

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("analyzeButton");


      const text =
        input.value.trim();


      result.style.display = "block";


      if (!text) {

        result.innerHTML =
          '<div class="status warning">' +
          '⚠️ Hãy dán liên kết video trước.' +
          '</div>';

        return;

      }


      const url =
        extractUrl(text);


      if (!url) {

        result.innerHTML =
          '<div class="status error">' +
          '❌ Không tìm thấy liên kết video.' +
          '</div>';

        return;

      }


      button.disabled = true;

      button.innerText =
        "⏳ ĐANG PHÂN TÍCH...";


      result.innerHTML =
        '<div class="status warning">' +
        '⏳ Đang lấy thông tin video...' +
        '</div>';


      try {

        const response =
          await fetch(
            API_URL + "/api/analyze",
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                url: url
              })

            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.message ||
            "Không lấy được thông tin video."
          );

        }


        /*
          Có thông tin video
          Ví dụ YouTube
        */

if (data.video) {

const video = data.video;

const thumbnail =
video.thumbnail
? `
<div class="thumbnail-wrapper">

      <img
        class="thumbnail"
        src="${escapeHtml(video.thumbnail)}"
        alt="Thumbnail video"
        onerror="this.parentElement.style.display='none';"
      >

      <div class="platform-badge">
        🎬 ${escapeHtml(
          data.platform || "Video"
        )}
      </div>

    </div>
  `
  : "";

result.innerHTML = `

<div class="status success">
  ✅ Đã lấy thông tin video!
</div>


<div class="video-card">

  ${thumbnail}


  <div class="video-content">

    <div class="video-title">

      ${escapeHtml(
        video.title ||
        "Không có tiêu đề"
      )}

    </div>


    <div class="video-info">

      <span class="info-label">
        👤 Kênh / Tác giả:
      </span>

      ${escapeHtml(
        video.channel ||
        "Không có thông tin"
      )}

      <br>


      <span class="info-label">
        ⏱️ Thời lượng:
      </span>

      ${formatDuration(
        video.duration
      )}

      <br>


      <span class="info-label">
        🌐 Nền tảng:
      </span>

      ${escapeHtml(
        data.platform ||
        "Không xác định"
      )}

    </div>


    <div class="video-url">

      ${escapeHtml(
        data.url || url
      )}

    </div>


    <button
      class="next-button"
      onclick="prepareNextStep()"
    >
      ⬇️ TIẾP TỤC
    </button>


  </div>

</div>

`;

}

else {

result.innerHTML = `

<div class="status success">

  ✅ Backend đã xử lý liên kết!

</div>


<div class="video-card">

  <div class="video-content">

    <div class="video-title">

      🎵 ${escapeHtml(
        data.platform ||
        "Video"
      )}

    </div>


    <div class="video-info">

      ${escapeHtml(
        data.message ||
        "Đã nhận diện liên kết."
      )}

    </div>


    <div class="video-url">

      ${escapeHtml(
        data.url || url
      )}

    </div>


    <button
      class="next-button"
      onclick="prepareNextStep()"
    >
      ⬇️ TIẾP TỤC
    </button>

  </div>

</div>

`;

}
