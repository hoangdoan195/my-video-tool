<h1>
  My Video Tool
</h1>

<p class="subtitle">
  Dán liên kết video hoặc nội dung chia sẻ
</p>

<label for="videoUrl">
  Liên kết video
</label>

<textarea
  id="videoUrl"
  placeholder="Dán link YouTube, TikTok, Facebook, Douyin..."
></textarea>

<button
  id="analyzeButton"
  class="analyze-button"
  onclick="analyzeVideo()"
>
  🔍 PHÂN TÍCH VIDEO
</button>

<div id="result"></div>

<div class="footer">
  My Video Tool
</div>

  </div>  <script>

    const API_URL =
      "https://my-video-tool-api.onrender.com";


    /*
    ========================================
    TÌM URL
    ========================================
    */

    function extractUrl(text) {

      const matches =
        text.match(
          /https?:\/\/[^\s"'<>]+/gi
        );

      if (
        matches &&
        matches.length > 0
      ) {

        return matches[0].replace(
          /[)\]}>，。！？；：]+$/g,
          ""
        );

      }

      return null;
    }


    /*
    ========================================
    FORMAT DURATION
    ========================================
    */

    function formatDuration(duration) {

      if (
        duration === null ||
        duration === undefined ||
        duration === ""
      ) {
        return "Không có thông tin";
      }

      const value =
        String(duration);

      const match =
        value.match(
          /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/i
        );

      if (!match) {

        const numeric =
          Number(duration);

        if (
          Number.isFinite(numeric)
        ) {

          const total =
            Math.round(numeric);

          const hours =
            Math.floor(total / 3600);

          const minutes =
            Math.floor(
              (total % 3600) / 60
            );

          const seconds =
            total % 60;

          if (hours > 0) {

            return (
              String(hours).padStart(2, "0") +
              ":" +
              String(minutes).padStart(2, "0") +
              ":" +
              String(seconds).padStart(2, "0")
            );

          }

          return (
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0")
          );
        }

        return value;
      }

      const hours =
        parseInt(match[1] || 0);

      const minutes =
        parseInt(match[2] || 0);

      const seconds =
        parseInt(match[3] || 0);

      if (hours > 0) {

        return (
          String(hours).padStart(2, "0") +
          ":" +
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0")
        );

      }

      return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
      );
    }


    /*
    ========================================
    ANALYZE VIDEO
    ========================================
    */

    async function analyzeVideo() {

      const input =
        document.getElementById(
          "videoUrl"
        );

      const result =
        document.getElementById(
          "result"
        );

      const button =
        document.getElementById(
          "analyzeButton"
        );

      const text =
        input.value.trim();

      result.style.display =
        "block";

      if (!text) {

        result.innerHTML = `
          <div class="status warning">
            ⚠️ Hãy dán liên kết video trước.
          </div>
        `;

        return;
      }

      const url =
        extractUrl(text);

      if (!url) {

        result.innerHTML = `
          <div class="status error">
            ❌ Không tìm thấy liên kết video.
          </div>
        `;

        return;
      }

      button.disabled = true;

      button.innerText =
        "⏳ ĐANG PHÂN TÍCH...";

      result.innerHTML = `
        <div class="status warning">
          ⏳ Đang lấy thông tin video...
        </div>
      `;

      try {

        const response =
          await fetch(
            API_URL + "/api/analyze",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  url: url
                })
            }
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Không lấy được thông tin video."
          );
        }

        const video =
          data.video || data;

        const thumbnailUrl =
          video.thumbnail ||
          data.thumbnail ||
          null;

        const title =
          video.title ||
          data.title ||
          "Không có tiêu đề";

        const channel =
          video.channel ||
          video.author ||
          data.channel ||
          data.author ||
          "Không có thông tin";

        const duration =
          video.duration ||
          data.duration ||
          null;

        const platform =
          data.platform ||
          video.platform ||
          "Video";


        /*
        ========================================
        THUMBNAIL
        ========================================
        */

        const thumbnail =
          thumbnailUrl
            ? `
              <div class="thumbnail-wrapper">

                <img
                  class="thumbnail"
                  src="${escapeHtml(thumbnailUrl)}"
                  alt="Thumbnail video"

                  onerror="
                    this.parentElement.style.display='none';
                  "
                >

                <div class="platform-badge">

                  ${getPlatformIcon(platform)}

                  ${escapeHtml(platform)}

                </div>

              </div>
            `
            : "";


        /*
        ========================================
        VIDEO CARD
        ========================================
        */

        result.innerHTML = `

          <div class="status success">
            ✅ Phân tích thành công!
          </div>

          <div class="video-card">

            ${thumbnail}

            <div class="video-content">

              <div class="video-title">
                ${escapeHtml(title)}
              </div>

              <div class="video-info">

                <span class="info-label">
                  👤 Kênh / Tác giả:
                </span>

                ${escapeHtml(channel)}

                <br>

                <span class="info-label">
                  ⏱️ Thời lượng:
                </span>

                ${formatDuration(duration)}

                <br>

                <span class="info-label">
                  🌐 Nền tảng:
                </span>

                ${escapeHtml(platform)}

              </div>

              <div class="video-url">
                ${escapeHtml(
                  data.url || url
                )}
              </div>

              <div
                id="downloadSection"
                class="download-section"
              >

                <div class="download-title">
                  ⬇️ Tùy chọn tải xuống
                </div>

                <div class="download-subtitle">
                  Chọn định dạng và chất lượng bạn muốn tải.
                </div>

                <div
                  id="formatList"
                  class="format-list"
                >

                  <div class="formats-loading">
                    ⏳ Đang kiểm tra các định dạng...
                  </div>

                </div>

                <button
                  id="downloadButton"
                  class="download-button"
                  onclick="downloadSelectedFormat()"
                  disabled
                >
                  ⬇️ TẢI XUỐNG
                </button>

              </div>

            </div>

          </div>

        `;


        /*
        ========================================
        LẤY FORMAT
        ========================================
        */

        await loadFormats(url);

      } catch (error) {

        console.error(error);

        result.innerHTML = `

          <div class="status error">

            ❌ Không lấy được thông tin video.

            <br><br>

            <span>
              ${escapeHtml(
                error.message
              )}
            </span>

          </div>

        `;

      } finally {

        button.disabled = false;

        button.innerText =
          "🔍 PHÂN TÍCH VIDEO";
      }

    }


    /*
    ========================================
    LOAD FORMATS
    ========================================
    */

    async function loadFormats(url) {

      const list =
        document.getElementById(
          "formatList"
        );

      const downloadButton =
        document.getElementById(
          "downloadButton"
        );

      if (!list) {
        return;
      }

      try {

        const response =
          await fetch(
            API_URL + "/api/formats",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  url: url
                })
            }
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Chưa lấy được danh sách định dạng."
          );
        }

        const formats =
          Array.isArray(data.formats)
            ? data.formats
            : [];

        if (
          formats.length === 0
        ) {

          list.innerHTML = `
            <div class="formats-loading">
              ⚠️ Video này chưa có thông tin định dạng tải xuống.
            </div>
          `;

          return;
        }

        renderFormats(
          formats
        );

        if (downloadButton) {
          downloadButton.disabled =
            false;
        }

      } catch (error) {

        console.error(
          "Format error:",
          error
        );

        /*
          Backend chưa có /api/formats
          thì không làm hỏng phần metadata.
        */

        list.innerHTML = `
          <div class="formats-loading">
            ℹ️ Danh sách chất lượng sẽ được hiển thị khi máy chủ tải xuống được kết nối.
          </div>
        `;

        if (downloadButton) {
          downloadButton.disabled =
            true;
        }
      }
    }


    /*
    ========================================
    RENDER FORMATS
    ========================================
    */

    function renderFormats(formats) {

      const list =
        document.getElementById(
          "formatList"
        );

      if (!list) {
        return;
      }

      /*
        Loại bỏ format trùng nhau
        theo loại + độ phân giải.
      */

      const unique =
        [];

      const seen =
        new Set();

      for (
        const format of formats
      ) {

        const extension =
          String(
            format.extension ||
            format.ext ||
            ""
          ).toLowerCase();

        const height =
          format.height ||
          "";

        const hasVideo =
          format.hasVideo !== false;

        const hasAudio =
          format.hasAudio !== false;

        let type =
          hasVideo
            ? "video"
            : "audio";

        const key =
          `${type}-${extension}-${height}`;

        if (
          seen.has(key)
        ) {
          continue;
        }

        seen.add(key);

        unique.push({
          ...format,
          type
        });
      }


      /*
        Sắp xếp:

        Video trước
        Độ phân giải cao trước
        Audio sau
      */

      unique.sort(
        (a, b) => {

          if (
            a.type !== b.type
          ) {

            return a.type === "video"
              ? -1
              : 1;
          }

          return (
            Number(b.height || 0) -
            Number(a.height || 0)
          );
        }
      );


      list.innerHTML =
        unique.map(
          (format, index) => {

            const extension =
              String(
                format.extension ||
                format.ext ||
                "mp4"
              ).toUpperCase();

            const height =
              format.height;

            const hasVideo =
              format.hasVideo !== false;

            const hasAudio =
              format.hasAudio !== false;

            let name;

            let detail;

            let icon;

            if (
              hasVideo
            ) {

              const quality =
                height
                  ? `${height}p`
                  : (
                      format.resolution ||
                      "Video"
                    );

              name =
                `${extension} • ${quality}`;

              if (
                Number(height) >= 1080
              ) {

                detail =
                  "Video • Full HD";

              } else if (
                Number(height) >= 720
              ) {

                detail =
                  "Video • HD";

              } else {

                detail =
                  "Video";
              }

              icon = "🎥";

            } else {

              name =
                "MP3 • Audio";

              detail =
                "Âm thanh";

              icon = "🎵";
            }

            const size =
              format.filesize ||
              format.filesizeApprox;

            const sizeText =
              size
                ? formatFileSize(size)
                : "";

            return `

              <div class="format-option">

                <input
                  type="radio"
                  name="videoFormat"
                  id="format-${index}"
                  value="${index}"
                >

                <label
                  class="format-label"
                  for="format-${index}"
                >

                  <span class="format-radio"></span>

                  <span class="format-icon">
                    ${icon}
                  </span>

                  <span class="format-main">

                    <span class="format-name">
                      ${escapeHtml(name)}
                    </span>

                    <span class="format-detail">
                      ${escapeHtml(detail)}
                      ${sizeText
                        ? " • " + escapeHtml(sizeText)
                        : ""}
                    </span>

                  </span>

                  <span class="format-badge">
                    ${extension}
                  </span>

                </label>

              </div>

            `;
          }
        )
        .join("");

      /*
        Lưu format để nút download
        biết người dùng chọn cái nào.
      */

      window.availableFormats =
        unique;
    }


    /*
    ========================================
    DOWNLOAD SELECTED FORMAT
    ========================================
    */

    function downloadSelectedFormat() {

      const selected =
        document.querySelector(
          'input[name="videoFormat"]:checked'
        );

      if (!selected) {

        alert(
          "Vui lòng chọn định dạng trước."
        );

        return;
      }

      const index =
        Number(
          selected.value
        );

      const formats =
        window.availableFormats ||
        [];

      const format =
        formats[index];

      if (!format) {

        alert(
          "Không tìm thấy định dạng đã chọn."
        );

        return;
      }

      /*
        Nếu backend đã trả URL trực tiếp,
        có thể sử dụng URL đó.

        Sau này ta sẽ chuyển sang
        endpoint download của backend
        để xử lý ổn định hơn.
      */

      if (
        format.url
      ) {

        const link =
          document.createElement(
            "a"
          );

        link.href =
          format.url;

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

        return;
      }

      alert(
        "Định dạng này chưa có đường dẫn tải. Backend cần cung cấp URL tải xuống."
      );
    }


    /*
    ========================================
    FILE SIZE
    ========================================
    */

    function formatFileSize(bytes) {

      const value =
        Number(bytes);

      if (
        !Number.isFinite(value) ||
        value <= 0
      ) {
        return "";
      }

      const units =
        [
          "B",
          "KB",
          "MB",
          "GB"
        ];

      let size =
        value;

      let index =
        0;

      while (
        size >= 1024 &&
        index < units.length - 1
      ) {

        size /= 1024;

        index++;
      }

      return (
        size.toFixed(
          size >= 100
            ? 0
            : 1
        ) +
        " " +
        units[index]
      );
    }


    /*
    ========================================
    PLATFORM ICON
    ========================================
    */

    function getPlatformIcon(platform) {

      const name =
        String(
          platform || ""
        ).toLowerCase();

      if (
        name.includes("youtube")
      ) {
        return "▶️";
      }

      if (
        name.includes("tiktok")
      ) {
        return "🎵";
      }

      if (
        name.includes("facebook")
      ) {
        return "📘";
      }

      if (
        name.includes("douyin")
      ) {
        return "🎵";
      }

      return "🎬";
    }


    /*
    ========================================
    ESCAPE HTML
    ========================================
    */

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );
    }


    /*
    ========================================
    ENTER = ANALYZE
    ========================================
    */

    document
      .getElementById("videoUrl")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.ctrlKey &&
            event.key === "Enter"
          ) {

            analyzeVideo();
          }

        }
      );
